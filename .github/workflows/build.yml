name: Build CoreType Module

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build & test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full cpio shellcheck zip python3-fonttools libharfbuzz-bin

      - name: Run POSIX test suite, C++20 daemon tests & linters
        run: sh tests/run_tests.sh

      - name: Compile native coretype-watchd (arm64-v8a / Android NDK C++20)
        run: |
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $NDK_ROOT"
          CXX="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          test -x "$CXX"
          mkdir -p bin
          "$CXX" -O2 -std=c++20 -fno-exceptions -fno-rtti \
            -ffunction-sections -fdata-sections -Wl,--gc-sections \
            -static-libstdc++ -Wall -Wextra -Werror -s \
            native/coretype-watchd.cpp -o bin/coretype-watchd
          file bin/coretype-watchd
          ls -lh bin/coretype-watchd
          readelf -d bin/coretype-watchd | grep NEEDED
          if readelf -d bin/coretype-watchd | grep -q 'libc++_shared'; then
            echo "ERROR: coretype-watchd must not depend on libc++_shared.so!"
            exit 1
          fi

      - name: Build optical-calibrated SF Pro variable fonts (iOS 27.x + Continuous opsz Flex)
        run: |
          /usr/bin/python3 scripts/build_fonts.py --out-dir fonts
          ls -lh fonts/

      - name: Verify HarfBuzz shaping, continuous opsz & Apple calt clock colon
        run: |
          python3 - <<'PY'
          import json, subprocess
          for f in [
              "fonts/CoreType-SFPro-Text.ttf",
              "fonts/CoreType-SFPro-Text-Italic.ttf",
              "fonts/CoreType-SFPro-Display.ttf",
              "fonts/CoreType-SFPro-Display-Italic.ttf",
              "fonts/CoreType-SFPro-Flex.ttf",
              "fonts/CoreType-SFPro-GMS-Medium.ttf",
              "fonts/CoreType-SFPro-GMS-Bold.ttf",
          ]:
              out = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", f, "Display & Typography"], text=True))
              assert sum(g["ax"] for g in out) > 0, f"Zero advance in {f}"
              assert any(g["dx"] < 0 for g in out), f"GPOS tracking missing in {f}"
          c_clock = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", "fonts/CoreType-SFPro-Display.ttf", "09:41"], text=True))[2]["g"]
          c_text  = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", "fonts/CoreType-SFPro-Display.ttf", "a:b"], text=True))[1]["g"]
          assert c_clock != c_text, "Apple calt centered clock colon did not activate!"
          d_disp = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", "fonts/CoreType-SFPro-Display.ttf", "100"], text=True))
          assert all(g["dx"] == 0 for g in d_disp), f"Unexpected negative tracking on Display digits: {d_disp}"
          d_flex_disp = json.loads(subprocess.check_output(["hb-shape", "--variations=opsz=28,wght=400", "--output-format=json", "fonts/CoreType-SFPro-Flex.ttf", "100"], text=True))
          assert all(g["dx"] == 0 for g in d_flex_disp), f"Unexpected negative tracking on Flex Display (opsz=28) digits: {d_flex_disp}"
          flex_12 = json.loads(subprocess.check_output(["hb-shape", "--variations=opsz=12,wght=400", "--output-format=json", "fonts/CoreType-SFPro-Flex.ttf", "Typography"], text=True))
          flex_22 = json.loads(subprocess.check_output(["hb-shape", "--variations=opsz=22,wght=400", "--output-format=json", "fonts/CoreType-SFPro-Flex.ttf", "Typography"], text=True))
          flex_36 = json.loads(subprocess.check_output(["hb-shape", "--variations=opsz=36,wght=400", "--output-format=json", "fonts/CoreType-SFPro-Flex.ttf", "Typography"], text=True))
          w12 = sum(g["ax"] for g in flex_12)
          w22 = sum(g["ax"] for g in flex_22)
          w36 = sum(g["ax"] for g in flex_36)
          assert w12 != w22 and w22 != w36 and w12 != w36, f"Flex continuous opsz axis had no visual advance delta ({w12} / {w22} / {w36})!"
          dx_text = min(g["dx"] for g in flex_12)
          dx_disp = min(g["dx"] for g in flex_36)
          assert dx_text < dx_disp < 0, f"Flex GPOS FeatureVariations did not relax tracking from Text to Display (dx_text={dx_text}, dx_disp={dx_disp})!"
          s_jdm = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", "fonts/CoreType-SFPro-Text.ttf", "Yanz 25 \u02b2\u1d48\u1d50"], text=True))
          assert all(g["g"] != ".notdef" for g in s_jdm), f"Missing superscript glyph in Phonetic Extensions: {s_jdm}"
          print(f"[PASS] HarfBuzz GPOS tracking, Flex continuous opsz (12:{w12} -> 22:{w22} -> 36:{w36}) + FeatureVariations (dx {dx_text}->{dx_disp}), pure digit spacing (100), Phonetic Extensions & Apple calt colon verified ({c_text} -> {c_clock})")
          PY

      - name: Package CoreType Lite (SF Pro Only)
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          mkdir -p dist
          zip -r9 "dist/CoreType-${VERSION}-Lite.zip" \
            module.prop \
            customize.sh \
            post-fs-data.sh \
            service.sh \
            action.sh \
            uninstall.sh \
            bin/ \
            lib/ \
            fonts/ \
            webroot/ \
            -x '*.DS_Store'
          ls -lh "dist/CoreType-${VERSION}-Lite.zip"

      - name: Fetch & verify Apple iOS 26.4 Color Emoji (Android CBDT/CBLC)
        run: |
          /usr/bin/python3 scripts/fetch_emoji.py --out fonts/CoreType-AppleEmoji.ttf
          ls -lh fonts/

      - name: Package CoreType Full (SF Pro + Apple iOS Emoji)
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          zip -r9 "dist/CoreType-${VERSION}-Full.zip" \
            module.prop \
            customize.sh \
            post-fs-data.sh \
            service.sh \
            action.sh \
            uninstall.sh \
            bin/ \
            lib/ \
            fonts/ \
            webroot/ \
            -x '*.DS_Store'
          ls -lh "dist/CoreType-${VERSION}-Full.zip"

      - name: Upload CoreType Lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreType-Lite-Zip
          path: dist/CoreType-*-Lite.zip

      - name: Upload CoreType Full artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreType-Full-Zip
          path: dist/CoreType-*-Full.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FULL_ZIP="dist/CoreType-${TAG}-Full.zip"
          LITE_ZIP="dist/CoreType-${TAG}-Lite.zip"
          FULL_SHA=$(sha256sum "$FULL_ZIP" | awk '{print $1}')
          LITE_SHA=$(sha256sum "$LITE_ZIP" | awk '{print $1}')
          FULL_SZ=$(du -h "$FULL_ZIP" | awk '{print $1}')
          LITE_SZ=$(du -h "$LITE_ZIP" | awk '{print $1}')

          cat > /tmp/release_notes.md <<EOF
          **CoreType ${TAG}** — Native Apple CoreText-Parity San Francisco Pro (iOS 27.x) & Apple iOS 26.4 Color Emoji engine exclusively engineered for **HyperOS 1 / 2 / 3 / 4 & Android 12–17 (ARM64)** (Magisk / KernelSU / KernelSU-Next / APatch).

          ---

          ### Editions
          | Edition | File | Size | SHA-256 |
          | :--- | :--- | :---: | :--- |
          | **Full** *(SF Pro + Continuous opsz Flex + C++20 epoll Daemon + MiSans Slider + iOS 26.4 Emoji)* | \`CoreType-${TAG}-Full.zip\` | ~${FULL_SZ} | \`${FULL_SHA}\` |
          | **Lite** *(SF Pro + Continuous opsz Flex + C++20 epoll Daemon + MiSans Slider)* | \`CoreType-${TAG}-Lite.zip\` | ~${LITE_SZ} | \`${LITE_SHA}\` |

          ---

          ### Highlights
          - **Dynamic \`opsz\`-Aware GPOS \`FeatureVariations\` & Semi-Display GMS Bold:** \`CoreType-SFPro-Flex.ttf\` (\`RobotoFlex-Regular.ttf\`) automatically transitions Apple tracking from **−46 UPM** (Text, \`opsz < 22\`) to **−26 UPM** (Display, \`opsz >= 22\`) inside Android HarfBuzz/Minikin, while \`CoreType-SFPro-GMS-Bold.ttf\` uses **Semi-Display (\`opsz=24\`)** proportions for crisp iOS-style headings across Play Store, Gmail, Maps, Photos, and Gboard (excluding \`Google_Sans_Code\` monospace).
          - **iOS 27 Liquid Glass & Settings Native 3-Tab WebUI:** Auto Light & Dark (\`prefers-color-scheme\`) with layered Liquid Glass lensing, interactive pointer inner-glow, **3-Tab Bottom Dock** (\`Typography\` · \`Ecosystem\` · \`Engine\`), **3 Quick Curve Presets**, **Instant Live-Apply** for Universal GMS App Fonts (\`SIGUSR1 < 5 ms\`, zero reboot), and **Tinted Solid Surfaces** accessibility mode (\`prefers-reduced-transparency\`).
          - **Native C++20 Event-Driven Daemon (\`coretype-watchd\`, ARM64):** Zero-polling \`epoll\` + \`inotify\` + dual \`timerfd\` (250 ms batch debounce + bounded \`1s → 3s → 10s\` self-healing recovery) + \`signalfd\` (< 300 KB private RAM, 0% idle CPU, 0 wakelock, isolated \`/dev/.coretype/\`). Reports \`daemon_private_kb\` alongside \`daemon_rss_kb\`, supports live \`umount2(MNT_DETACH)\` on toggle OFF, and syncs live mount counts cleanly into \`state.prop\` & \`action.sh --diag\`.
          - **4:1 Vertical Metrics Parity, Dynamic Weight Curve & Apple iOS 26.4 Emoji:** \`1968 / −492\` CJK-aligned metrics, \`tnum\` + \`calt\` (\`09:41\`), stock \`MiClock*.otf\` preservation, MiSans Font Weight slider support, and KernelSU-umount-safe Apple iOS 26.4 Color Emoji.

          ---

          ### KernelSU / KernelSU-Next Note
          - Keep global **\`Umount modules\`** **OFF** (with \`Superuser\` **OFF**) for everyday apps where you want SF Pro & Apple iOS Emoji, and enable \`Custom → Umount modules = ON\` specifically for banking / e-wallet apps.
          - If Gboard retains old Google emoji previews on first boot, clear **Gboard cache** once (not data).

          ---

          <sub>*Source code is licensed under MIT. CoreType is an independent, non-commercial community project not affiliated with Apple Inc., Xiaomi Corp., or Google LLC.*</sub>
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL_ZIP" "$LITE_ZIP" --clobber
          else
            gh release create "$TAG" "$FULL_ZIP" "$LITE_ZIP" \
              --title "CoreType ${TAG} — Dual-Optical SF Pro & iOS 26.4 Emoji" \
              --notes-file /tmp/release_notes.md
          fi
