name: Build CoreType Module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build & test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full cpio shellcheck zip python3-fonttools libharfbuzz-bin

      - name: Run POSIX test suite & ShellCheck
        run: sh tests/run_tests.sh

      - name: Build optical-calibrated SF Pro variable fonts
        run: |
          /usr/bin/python3 scripts/build_fonts.py --out-dir system/fonts
          ls -lh system/fonts/

      - name: Verify HarfBuzz shaping & Apple calt clock colon
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          for f in [
              "system/fonts/CoreType-SFPro-Text.ttf",
              "system/fonts/CoreType-SFPro-Text-Italic.ttf",
              "system/fonts/CoreType-SFPro-Display.ttf",
              "system/fonts/CoreType-SFPro-Display-Italic.ttf",
          ]:
              out = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", f, "Display & Typography"], text=True))
              assert sum(g["ax"] for g in out) > 0, f"Zero advance in {f}"
              assert any(g["dx"] < 0 for g in out), f"GPOS tracking missing in {f}"
          c_clock = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", "system/fonts/CoreType-SFPro-Display.ttf", "09:41"], text=True))[2]["g"]
          c_text  = json.loads(subprocess.check_output(["hb-shape", "--output-format=json", "system/fonts/CoreType-SFPro-Display.ttf", "a:b"], text=True))[1]["g"]
          assert c_clock != c_text, "Apple calt centered clock colon did not activate!"
          print(f"[PASS] HarfBuzz GPOS tracking & Apple calt clock colon verified ({c_text} -> {c_clock})")
          PY

      - name: Package flashable Magisk / KernelSU / APatch zip
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          mkdir -p dist
          zip -r9 "dist/CoreType-${VERSION}.zip" \
            module.prop \
            customize.sh \
            post-fs-data.sh \
            service.sh \
            uninstall.sh \
            lib/ \
            system/ \
            webroot/ \
            -x '*.DS_Store'
          ls -lh "dist/CoreType-${VERSION}.zip"

      - name: Upload CoreType flashable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreType-Flashable-Zip
          path: dist/CoreType-*.zip
